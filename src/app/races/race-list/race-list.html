<section class="race-list">
  <header class="race-list__header">
    <h1 class="race-list__title">Trail Races</h1>

    <p class="race-list__subtitle">
      Find your next trail running race.
    </p>
  </header>

  @if (isLoading()) {
    <mat-card>
      <mat-card-content>
        Loading races...
      </mat-card-content>
    </mat-card>
  } @else if (error()) {
    <mat-card>
      <mat-card-content>
        Failed to load races.
      </mat-card-content>
    </mat-card>
  } @else {
    @for (race of races(); track race.id) {
      <mat-card class="race-list__card">
        <mat-card-header>
          <mat-card-title>{{ race.name }}</mat-card-title>
          <mat-card-subtitle>
            {{ race.location }} · {{ race.distance }} km
          </mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <p>{{ race.description }}</p>
        </mat-card-content>
      </mat-card>
    }
  }
</section>
