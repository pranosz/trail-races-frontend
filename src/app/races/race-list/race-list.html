<section class="race-list">
  <header class="race-list__header">
    <h1 class="race-list__title">Trail Races</h1>

    <p class="race-list__subtitle">
      Find your next trail running race.
    </p>
  </header>

  <form
    class="race-list__search"
    [formGroup]="searchForm"
    (ngSubmit)="search()"
  >
    <mat-form-field>
      <mat-label>Search</mat-label>
      <input
        matInput
        formControlName="search"
        placeholder="Race name, location..."
      />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Distance from</mat-label>
      <input
        matInput
        type="number"
        min="0"
        formControlName="distanceFrom"
      />
      <span matTextSuffix>km</span>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Distance to</mat-label>
      <input
        matInput
        type="number"
        min="0"
        formControlName="distanceTo"
      />
      <span matTextSuffix>km</span>
    </mat-form-field>

    <button
      matButton="filled"
      type="submit"
      [disabled]="isLoading()"
    >
      Search
    </button>
  </form>

  @if (isLoading()) {
    <mat-card>
      <mat-card-content>
        Loading races...
      </mat-card-content>
    </mat-card>
  } @else if (error()) {
    <mat-card>
      <mat-card-content>
        Failed to load races.
      </mat-card-content>
    </mat-card>
  } @else {
    <div class="race-list__items">
      @for (race of races(); track race.id) {
        <app-race-card [race]="race" />
      }
    </div>

    <mat-paginator
      [length]="totalElements()"
      [pageIndex]="currentPage()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="changePage($event)"
      aria-label="Select race page"
    />
  }
</section>
